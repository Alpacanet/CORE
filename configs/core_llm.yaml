# Pure ID input: no tokenizer, item text, or metadata.
embedding_size: 100
loss_type: CE
sess_dropout: 0.2
item_dropout: 0.2
temperature: 0.07

llm_name: Qwen/Qwen3-0.6B-Base
# Pin the public snapshot for reproducible frozen-weight reconstruction.
llm_revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
llm_init: pretrained
llm_tuning: lora
llm_dtype: bfloat16
llm_seed: 2020
llm_core_branch: ave
llm_fusion: gate
llm_gradient_checkpointing: true
llm_local_files_only: false
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
gate_bias: 1.0

# Only used when llm_core_branch=trm.
inner_size: 256
n_layers: 2
n_heads: 2
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
